<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="安心陪伴 — 開始之前，先簡單認識您的孩子，幫助我們提供更貼心的陪伴內容。">
    <title>安心陪伴 · 開始之前</title>
    <!-- 拉丁字與數字使用無障礙字體 Atkinson Hyperlegible；中文交回系統 CJK 字體 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="site-header">
        <div class="wrap header-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg class="icon icon-lg" viewBox="0 0 24 24" role="img">
                        <path
                            d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
                    </svg>
                </span>
                <div class="brand-text">
                    <h1>安心陪伴</h1>
                    <p class="tagline">開始之前，先簡單認識您的孩子</p>
                </div>
            </div>
        </div>
    </header>

    <main id="main" class="wrap">

        <!-- 表單畫面 -->
        <div id="formView">
            <div class="intro-note">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 8v5M12 16h.01" />
                </svg>
                <p>不需要註冊，只需要花 1 分鐘。這些資訊只用來讓陪伴內容更貼近您孩子的狀況，24 小時後會自動失效。</p>
            </div>

            <div id="errorSummary" class="error-summary" role="alert" tabindex="-1" hidden>
                <h2 id="errorSummaryTitle">請確認以下欄位</h2>
                <ul id="errorList"></ul>
            </div>

            <form id="personalInfoForm" novalidate>

                <!-- 1. 暱稱 -->
                <div class="field">
                    <label for="nickname">小孩的暱稱 <span class="req">*</span></label>
                    <input type="text" id="nickname" name="nickname" maxlength="20" autocomplete="off"
                        placeholder="例如：小恩" aria-describedby="nickname-error">
                    <p class="field-error" id="nickname-error" hidden></p>
                </div>

                <!-- 2. 年紀 -->
                <fieldset class="field field-age">
                    <legend>小孩的年紀 <span class="req">*</span></legend>
                    <div class="age-slider-wrap">
                        <div class="age-bubble" id="ageBubble" aria-hidden="true">5 歲</div>
                        <input type="range" id="ageIndex" min="0" max="24" step="1" value="10"
                            aria-label="小孩的年紀" aria-describedby="ageOut age-error">
                    </div>
                    <p class="age-scale-caption"><span>0 歲</span><span>18 歲</span></p>
                    <p class="age-readout">目前選擇：<output id="ageOut" for="ageIndex">尚未選擇，請拖曳滑桿</output></p>
                    <p class="field-error" id="age-error" hidden></p>
                </fieldset>

                <!-- 3. 性別 -->
                <fieldset class="field">
                    <legend>小孩的性別 <span class="req">*</span></legend>
                    <div class="segmented" role="radiogroup" aria-label="小孩的性別">
                        <label class="segmented-option">
                            <input type="radio" name="gender" value="男" required>
                            <span>男</span>
                        </label>
                        <label class="segmented-option">
                            <input type="radio" name="gender" value="女">
                            <span>女</span>
                        </label>
                    </div>
                    <p class="field-error" id="gender-error" hidden></p>
                </fieldset>

                <!-- 4. 害怕程度 -->
                <fieldset class="field">
                    <legend>小孩會害怕抽血嗎？ <span class="req">*</span></legend>
                    <div class="face-scale" role="radiogroup" aria-label="小孩害怕抽血的程度，1 為最不會，5 為最會" id="fearScale">
                    </div>
                    <p class="scale-caption"><span>最不會</span><span>最會</span></p>
                    <p class="field-error" id="fearLevel-error" hidden></p>
                </fieldset>

                <!-- 5. 家長擔心程度 -->
                <fieldset class="field">
                    <legend>家長會擔心小孩嗎？ <span class="req">*</span></legend>
                    <div class="face-scale" role="radiogroup" aria-label="家長擔心小孩的程度，1 為最不會，5 為最會" id="worryScale">
                    </div>
                    <p class="scale-caption"><span>最不會</span><span>最會</span></p>
                    <p class="field-error" id="worryLevel-error" hidden></p>
                </fieldset>

                <!-- 6. 特殊需求 -->
                <div class="field">
                    <label for="specialNeeds">小孩的特殊需求（選填）</label>
                    <textarea id="specialNeeds" name="specialNeeds" maxlength="200"
                        placeholder="例如：對某些藥物過敏、特殊病史、其他提醒事項…"></textarea>
                </div>

                <button class="btn btn-primary" type="submit">完成，開始使用</button>
            </form>
        </div>

        <!-- 完成畫面 -->
        <section id="successView" class="success-view" aria-live="polite" hidden>
            <div class="success-icon" aria-hidden="true">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M20 6 9 17l-5-5" />
                </svg>
            </div>
            <h2 id="successHeading" tabindex="-1">已經準備好了</h2>
            <p>資料已安全保存在這台裝置上，24 小時內有效。</p>

            <div class="code-card">
                <p class="code-label">您的暫時代碼</p>
                <p class="code-digits" id="codeDigits">0000</p>
                <p class="code-expiry" id="codeExpiry"></p>
            </div>

            <dl class="summary-card" id="summaryCard"></dl>

            <div class="success-actions">
                <button class="btn btn-ghost" type="button" id="restartBtn">重新填寫</button>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
