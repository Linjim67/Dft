<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="兒童醫療恐懼緩解與安慰經驗分享討論區 — 家長與醫療人員一起交流如何陪伴孩子面對打針與檢查。">
    <title>安心陪伴 · 兒童醫療安撫經驗分享</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <a class="skip-link" href="#main">跳到主要內容</a>

    <header class="site-header">
        <div class="wrap header-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">🧸</span>
                <div class="brand-text">
                    <h1>安心陪伴</h1>
                    <p class="tagline">兒童醫療安撫經驗分享 · 打針．抽血．檢查不害怕</p>
                </div>
            </div>
            <button class="btn btn-primary" id="openComposerBtn" type="button">
                <span aria-hidden="true">＋</span> 分享經驗
            </button>
        </div>
    </header>

    <main id="main" class="wrap">

        <!-- 搜尋 / 篩選 / 排序工具列 -->
        <section class="toolbar" aria-label="搜尋與篩選">
            <div class="search-row">
                <label class="search-box">
                    <span class="visually-hidden">搜尋討論</span>
                    <span class="search-icon" aria-hidden="true">🔍</span>
                    <input type="search" id="searchInput" placeholder="搜尋關鍵字、內容、標籤或作者…" autocomplete="off">
                </label>
                <select id="sortSelect" aria-label="排序方式">
                    <option value="hot">熱門推薦</option>
                    <option value="new">最新發布</option>
                    <option value="replies">回覆最多</option>
                </select>
                <button class="btn btn-ghost" id="toggleFiltersBtn" type="button" aria-expanded="false"
                    aria-controls="filterPanel">篩選</button>
            </div>

            <div class="filter-panel" id="filterPanel" hidden>
                <div class="field">
                    <label for="filterRole">身分角色</label>
                    <select id="filterRole">
                        <option value="">全部</option>
                        <option value="家長">家長</option>
                        <option value="醫師">醫師</option>
                        <option value="護士">護士</option>
                        <option value="醫檢師">醫檢師</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="field">
                    <label for="filterGender">孩子性別</label>
                    <select id="filterGender">
                        <option value="">全部</option>
                        <option value="男孩">男孩</option>
                        <option value="女孩">女孩</option>
                        <option value="不指定">不指定</option>
                    </select>
                </div>
                <div class="field field-age">
                    <label for="filterAge">適用年齡 <output id="filterAgeOut">全部</output></label>
                    <div class="age-slider-row">
                        <input type="range" id="filterAge" min="-1" max="18" step="0.5" value="-1">
                    </div>
                    <p class="hint">拖到最左＝不限年齡；含蓋此年齡的討論都會顯示。</p>
                </div>
                <div class="field field-tag">
                    <label for="filterHashtag">標籤</label>
                    <input type="text" id="filterHashtag" placeholder="例如：打針">
                </div>
                <button class="btn btn-ghost" id="clearFilterBtn" type="button">清除篩選</button>
            </div>
        </section>

        <!-- 討論串列表 -->
        <section id="threadsContainer" aria-live="polite" aria-busy="true">
            <p class="state-msg">載入中…</p>
        </section>
    </main>

    <!-- 發布討論的對話框 -->
    <dialog id="composer" aria-labelledby="composerTitle">
        <form id="postForm" method="dialog">
            <div class="dialog-head">
                <h2 id="composerTitle">分享一段安撫經驗</h2>
                <button class="icon-btn" type="button" id="closeComposerBtn" aria-label="關閉">✕</button>
            </div>

            <div class="dialog-body">
                <div class="grid-2">
                    <div class="field">
                        <label for="postRole">你的身分 <span class="req">*</span></label>
                        <select id="postRole" required>
                            <option value="家長">家長</option>
                            <option value="醫師">醫師</option>
                            <option value="護士">護士</option>
                            <option value="醫檢師">醫檢師</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                    <div class="field">
                        <label for="postAuthor">暱稱（選填）</label>
                        <input type="text" id="postAuthor" placeholder="匿名" maxlength="50">
                    </div>
                </div>

                <fieldset class="members">
                    <legend>孩子的年齡與性別 <span class="req">*</span></legend>
                    <p class="hint">可新增多位孩子，分享不同年紀的經驗。醫療人員可切換成「年齡範圍」。</p>
                    <div id="membersList"></div>
                    <button class="btn btn-ghost btn-sm" type="button" id="addMemberBtn">＋ 新增一位孩子</button>
                </fieldset>

                <div class="field">
                    <label for="postHashtag">標籤（選填）</label>
                    <input type="text" id="postHashtag" placeholder="例如：打針, 抽血, 分散注意力（以逗號分隔）">
                    <p class="hint">最多 5 個標籤，方便別人搜尋到你的經驗。</p>
                </div>

                <div class="field">
                    <label for="postContent">分享內容 <span class="req">*</span></label>
                    <textarea id="postContent" rows="6"
                        placeholder="描述當時的情境、你用了什麼方法安撫孩子、效果如何……"
                        maxlength="2000" required></textarea>
                    <p class="hint"><span id="contentCount">0</span> / 2000</p>
                </div>
            </div>

            <div class="dialog-foot">
                <button class="btn btn-ghost" type="button" id="cancelComposerBtn">取消</button>
                <button class="btn btn-primary" type="submit" id="submitPostBtn">發布分享</button>
            </div>
        </form>
    </dialog>

    <!-- 樣板：一位孩子的輸入列（由 JS 複製使用） -->
    <template id="memberTemplate">
        <div class="member-card">
            <div class="member-head">
                <div class="field">
                    <label>性別</label>
                    <select class="member-gender">
                        <option value="男孩">男孩</option>
                        <option value="女孩">女孩</option>
                        <option value="不指定">不指定</option>
                    </select>
                </div>
                <label class="switch">
                    <input type="checkbox" class="member-range-toggle">
                    <span>年齡範圍</span>
                </label>
                <button class="icon-btn member-remove" type="button" aria-label="移除這位孩子">✕</button>
            </div>

            <div class="member-single">
                <label>年齡：<output class="member-age-out">3 歲</output></label>
                <input type="range" class="member-age" min="0" max="18" step="0.5" value="3">
            </div>

            <div class="member-range" hidden>
                <label>最小年齡：<output class="member-agemin-out">3 歲</output></label>
                <input type="range" class="member-agemin" min="0" max="18" step="0.5" value="3">
                <label>最大年齡：<output class="member-agemax-out">6 歲</output></label>
                <input type="range" class="member-agemax" min="0" max="18" step="0.5" value="6">
            </div>
        </div>
    </template>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="script.js"></script>
</body>

</html>
