<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#E9E1D8">
  <title>安心陪伴 · 主頁面</title>
  <!-- favicon：/favicon/（ver1.svg 兩支針筒組成的 N）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/home/home.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <main id="main" class="wrap site-top">

    <!-- 畫面上不放大標題（最上面就是代碼），標題留給螢幕閱讀器 -->
    <h1 class="sr-only">安心陪伴主頁面</h1>

    <!-- ── 1. 暫時代碼（不顯示有效日期）；右下角的筆 = 修改資料（看、改、重新填寫都在 /portal/?edit，代碼不變） ── -->
    <section class="brief" aria-label="暫時代碼">
      <div class="code-card" id="codeCard">
        <p class="code-label">暫時代碼</p>
        <p class="code-digits" id="codeDigits">----</p>
        <!-- 醫檢師送出回饋後，代碼就失效了：這一行會換成「已完成」 -->
        <p class="code-note" id="codeNote" role="status">打針時，請把這組代碼交給醫檢師</p>
        <a class="code-edit" href="/portal/?edit" aria-label="修改資料" title="修改資料">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10v4Z" />
            <path d="m13 7 4 4" />
          </svg>
        </a>
      </div>
    </section>

    <!-- ── 2. 四個功能：一個圓切成四個四分之一圓的白色按鈕，中間十字形的縫隔開。
         左上 → 右上 → 左下 → 右下 = 閱讀順序。白底、黑色線條圖示、黑字；按下只有那一塊有反應。 ── -->
    <h2 class="sr-only">等待的時候</h2>
    <nav class="quad" aria-label="等待的時候">
      <a class="quad-item is-tl" href="/guide/">
        <span class="quad-body">
          <span class="quad-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M4 8.5A3.5 3.5 0 0 1 7.5 5h12A3.5 3.5 0 0 1 23 8.5v6a3.5 3.5 0 0 1-3.5 3.5H11.5L6 22.5V18A3.5 3.5 0 0 1 4 14.5Z" />
              <path d="M13.5 15.6s-3.7-2.1-3.7-4.7a1.95 1.95 0 0 1 3.7-.9 1.95 1.95 0 0 1 3.7.9c0 2.6-3.7 4.7-3.7 4.7Z" />
              <path d="M17.5 23a3 3 0 0 1 3-3h5.5a3 3 0 0 1 3 3v.5a3 3 0 0 1-3 3H25V29l-3.3-2.5h-1.2a3 3 0 0 1-3-3Z" />
              <path d="M21.4 23.3h.01M24.6 23.3h.01" />
            </svg>
          </span>
          <span class="quad-label">安慰指南</span>
        </span>
      </a>
      <a class="quad-item is-tr" href="/cheer/">
        <span class="quad-body">
          <span class="quad-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <circle cx="13" cy="13.5" r="9.5" />
              <path d="M10 11a3 3 0 1 1 4.2 2.8c-.8.4-1.2 1-1.2 1.8v.7M13 19.6h.01" />
              <circle cx="23.5" cy="23" r="5.5" />
              <path d="M23.5 20.4v2.8M23.5 25.7h.01" />
            </svg>
          </span>
          <span class="quad-label">抽血大小問</span>
        </span>
      </a>
      <a class="quad-item is-bl" href="/games/solo/">
        <span class="quad-body">
          <span class="quad-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M9.5 10.5h13a6.3 6.3 0 0 1 6.1 7.9l-1 3.9a3.5 3.5 0 0 1-6 1.4l-2.1-2.4h-7l-2.1 2.4a3.5 3.5 0 0 1-6-1.4l-1-3.9a6.3 6.3 0 0 1 6.1-7.9Z" />
              <path d="M10 14.3v4.6M7.7 16.6h4.6" />
              <circle class="ink" cx="20.7" cy="14.8" r="1.05" />
              <circle class="ink" cx="24.3" cy="18.1" r="1.05" />
              <path d="M16 3.5v3.2M14.4 5.1h3.2" />
            </svg>
          </span>
          <span class="quad-label">玩遊戲</span>
        </span>
      </a>
      <a class="quad-item is-br" href="/books/">
        <span class="quad-body">
          <span class="quad-icon" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M16 9.5C13.4 7.6 9.6 6.8 4.5 7v16.5c5.1-.2 8.9.6 11.5 2.5Z" />
              <path d="M16 9.5c2.6-1.9 6.4-2.7 11.5-2.5v16.5c-5.1-.2-8.9.6-11.5 2.5Z" />
              <path d="M7.8 12.3c2 0 3.8.4 5.2 1.1M7.8 16c2 0 3.8.4 5.2 1.1" />
              <path class="ink" d="m21.8 11.6 1 2.1 2.3.3-1.7 1.6.4 2.3-2-1.1-2 1.1.4-2.3-1.7-1.6 2.3-.3Z" />
            </svg>
          </span>
          <span class="quad-label">看繪本</span>
        </span>
      </a>
    </nav>

    <!-- ── 5. 開始打針（#03） ── -->
    <a class="btn btn-primary start-btn" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </main>

  <!-- 只用來確認代碼是否已由醫檢師完成；載不到時代碼卡維持原樣 -->
  <script type="module" src="/shared/firebase.js"></script>
  <script src="/home/home.js"></script>
</body>

</html>
