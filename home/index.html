<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 主頁面</title>
  <!-- favicon：/favicon/（ver1.svg 兩支針筒組成的 N）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/home/home.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <main id="main" class="wrap site-top">

    <!-- 畫面上不放大標題（最上面就是代碼），標題留給螢幕閱讀器 -->
    <h1 class="sr-only">安心陪伴主頁面</h1>

    <!-- ── 1. 暫時代碼：主頁面只留這個，其他填寫內容在「修改填寫內容」 ── -->
    <section class="brief" aria-label="暫時代碼">
      <div class="code-card" id="codeCard">
        <p class="code-label">暫時代碼</p>
        <p class="code-digits" id="codeDigits">----</p>
        <p class="code-expiry" id="codeExpiry"></p>
        <!-- 醫檢師送出回饋後，代碼就失效了：這一行會換成「已完成」 -->
        <p class="code-note" id="codeNote" role="status">打針時，請把這組代碼交給醫檢師</p>
      </div>
    </section>

    <!-- ── 2–4. 等待時的功能 ── -->
    <h2 class="section-title">等待的時候</h2>

    <div class="card-list">
      <!-- 填寫的內容（暫時代碼以外）都在這裡看、在這裡改；代碼不變。重新填寫也在那頁 -->
      <a class="nav-card" href="/portal/?edit">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M4.5 19.5h4l10-10a2.8 2.8 0 0 0-4-4l-10 10v4Z" />
            <path d="m13 7 4 4" />
          </svg>
        </span>
        <span>
          <span class="card-title">修改填寫內容</span>
          <span class="card-desc" id="profileDesc">查看或修改孩子的資料</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <a class="nav-card" href="/guide/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M12 6.5C10.2 5.1 7.7 4.5 5 4.5v13c2.7 0 5.2.6 7 2 1.8-1.4 4.3-2 7-2v-13c-2.7 0-5.2.6-7 2Z" />
            <path d="M12 6.5v13" />
          </svg>
        </span>
        <span>
          <span class="card-title">家長安慰指南</span>
          <span class="card-desc">陪孩子度過打針的小方法</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <a class="nav-card" href="/cheer/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M12 20s-7-4.3-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7 2.6C19 15.7 12 20 12 20Z" />
          </svg>
        </span>
        <span>
          <span class="card-title">給家長的鼓勵</span>
          <span class="card-desc">看懂抽血現場，心裡更踏實</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <!-- 小遊戲：同一個 chunk，拆成單機／雙機兩顆按鈕 -->
      <section class="chunk-card" aria-labelledby="gamesTitle">
        <div class="chunk-head">
          <span class="card-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="icon">
              <rect x="3" y="7.5" width="18" height="10" rx="5" />
              <path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M17.5 13.5h.01" />
            </svg>
          </span>
          <span>
            <span id="gamesTitle" class="card-title">小遊戲</span>
            <span class="card-desc">玩遊戲，放輕鬆</span>
          </span>
        </div>
        <div class="card-actions">
          <a class="btn btn-quiet game-btn" href="/games/solo/">
            <span class="game-btn-label">單機</span>
            <span class="game-btn-sub">一支手機</span>
          </a>
          <a class="btn btn-quiet game-btn" href="/games/duo/">
            <span class="game-btn-label">雙機</span>
            <span class="game-btn-sub">兩支手機一起玩</span>
          </a>
        </div>
      </section>
    </div>

    <!-- ── 5. 開始打針（#03） ── -->
    <a class="btn btn-primary start-btn" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </main>

  <!-- 只用來確認代碼是否已由醫檢師完成；載不到時代碼卡維持原樣 -->
  <script type="module" src="/shared/firebase.js"></script>
  <script src="/home/home.js"></script>
</body>

</html>
