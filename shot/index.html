<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 開始打針</title>
  <!-- favicon：手繪針筒（/favicon.svg）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/shot/shot.css">
  <script src="/shared/app.js"></script>
  <script>
    Anxin.requireProfile();
    /* 打針完畢頁（/shot/?done=1）：第一個畫面就是它，不會先閃出「我們一起加油」 */
    if (/[?&]done=1(&|$)/.test(location.search)) document.documentElement.classList.add('is-finished');
  </script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="wrap topbar">
    <a class="back-link" href="/home/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>回主頁</span>
    </a>
  </header>

  <main id="main" class="wrap">
    <div class="shot-stage">
      <div class="shot-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M12 20.5s-7.2-4.35-7.2-9.4A4.3 4.3 0 0 1 12 8.6a4.3 4.3 0 0 1 7.2 2.5c0 5.05-7.2 9.4-7.2 9.4Z" />
        </svg>
      </div>
      <h1 class="shot-title" id="shotTitle">我們一起加油</h1>
      <p class="shot-lede">深呼吸，很快就結束了。<br>打完之後，按下面的按鈕。</p>

      <!-- 醫檢師要用這組代碼查孩子的資料 -->
      <p class="shot-code" id="shotCode">
        <span>給醫檢師的代碼</span>
        <strong class="shot-code-digits" id="shotCodeDigits">----</strong>
      </p>

      <button class="btn btn-primary shot-done" type="button" id="doneBtn">打針完畢</button>
    </div>

    <!-- ══ 打針完畢：醫檢師送出回饋後自動切到這裡（主頁、指南、鼓勵頁會轉過來） ══
         規格同「打針完畢」視窗：給建議，或離開（前往感謝頁） -->
    <section class="finished" id="finishedView" aria-labelledby="finishedTitle">
      <div class="finished-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon"><path d="M6 12.4 10.2 16.6 18 8.8" /></svg>
      </div>
      <h1 class="shot-title" id="finishedTitle" tabindex="-1">打針完畢！</h1>
      <p class="shot-lede">您和<span id="finishedName">孩子</span>都好勇敢。</p>
      <p class="finished-ask">可以給我們團隊一些建議嗎？</p>
      <div class="finished-actions">
        <a class="btn btn-primary" href="/feedback/">好，給建議</a>
        <a class="btn btn-quiet" href="/thanks/">不用了，離開</a>
      </div>
    </section>
  </main>

  <!-- 規格：打針完畢 → 給建議，或離開（前往感謝頁） -->
  <dialog class="dlg" id="doneDlg" aria-labelledby="doneTitle" aria-describedby="doneBody">
    <h2 class="dlg-title" id="doneTitle">辛苦了！</h2>
    <p class="dlg-body" id="doneBody">可以給我們團隊一些建議嗎？</p>
    <div class="dlg-actions">
      <a class="btn btn-primary" href="/feedback/">好，給建議</a>
      <a class="btn btn-quiet" href="/thanks/">不用了，離開</a>
      <!-- 手機沒有 Esc 鍵：誤按時要有路可退 -->
      <button class="quiet-link" type="button" data-close>還沒打完</button>
    </div>
  </dialog>

  <script type="module" src="/shared/firebase.js"></script>
  <script src="/shot/shot.js"></script>
</body>

</html>
