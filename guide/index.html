<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#E9E1D8">
  <title>安心陪伴 · 家長安慰指南</title>
  <!-- favicon：/favicon/（ver1.svg 兩支針筒組成的 N）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/guide/guide.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body class="booklet">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <!-- 規格：任何子頁都能直接「開始打針」 -->
  <header class="wrap topbar">
    <a class="back-link" href="/home/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>回主頁</span>
    </a>
    <a class="pill-cta" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <h1>家長安慰指南</h1>
      <p class="page-lede">陪孩子度過打針的小方法。</p>
    </div>

    <!-- 章節選單：捲動時黏在頂端；每章一個色點，目前所在的章節會標出來 -->
    <nav class="jump" aria-label="本頁段落">
      <a class="jump-link" href="#say" data-tone="apricot"><span class="jump-dot" aria-hidden="true"></span>怎麼說</a>
      <a class="jump-link" href="#during" data-tone="sage"><span class="jump-dot" aria-hidden="true"></span>打針當下</a>
      <a class="jump-link" href="#dont" data-tone="honey"><span class="jump-dot" aria-hidden="true"></span>不要說</a>
    </nav>

    <!-- ── 1. 你可以這樣跟他說！依年紀分組（預設依小檔案的年紀選好） ── -->
    <section class="part" id="say" data-tone="apricot" aria-labelledby="sayTitle">
      <div class="part-head">
        <span class="part-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z" />
            <path d="M12 13.4s-2.8-1.6-2.8-3.5a1.5 1.5 0 0 1 2.8-.8 1.5 1.5 0 0 1 2.8.8c0 1.9-2.8 3.5-2.8 3.5Z" />
          </svg>
        </span>
        <h2 class="part-title" id="sayTitle">你可以這樣跟他說！</h2>
      </div>

      <fieldset class="age-pick">
        <legend class="live-region">孩子的年紀</legend>
        <div class="age-options" id="ageOptions"></div>
      </fieldset>
      <p class="age-hint" id="ageHint" hidden></p>

      <div id="agePanels"></div>
    </section>

    <!-- ── 2. 打針當下，家長可以這樣做！（全年齡） ── -->
    <section class="part" id="during" data-tone="sage" aria-labelledby="duringTitle">
      <div class="part-head">
        <!-- 大人牽著小孩 -->
        <span class="part-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <circle cx="8.5" cy="5.8" r="2.4" />
            <circle cx="16.8" cy="9.6" r="1.9" />
            <path d="M8.5 9.6v5.2M8.5 14.8 6.4 20.5M8.5 14.8l2.1 5.7M5.2 11.8l3.3-1.4 3.6 2.4 2.8-.6" />
            <path d="M16.8 12.6v3.8M16.8 16.4l-1.4 4.1M16.8 16.4l1.4 4.1" />
          </svg>
        </span>
        <h2 class="part-title" id="duringTitle">打針當下，家長可以這樣做！</h2>
        <p class="part-sub"><span class="all-ages">全年齡適用</span>你的陪伴很重要，你的配合更是孩子安全完成抽血的重要關鍵。</p>
      </div>
      <div class="topic-list" id="duringList"></div>

      <!-- 規格：這一塊最下方放「我要打針了」，直接連到轉移注意力的小遊戲 -->
      <a class="ready-card" href="/games/solo/">
        <span class="ready-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <rect x="3" y="7.5" width="18" height="10" rx="5" />
            <path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M17.5 13.5h.01" />
          </svg>
        </span>
        <span>
          <span class="ready-label">我要打針了</span>
          <span class="ready-sub">打開小遊戲，讓孩子專心玩</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon ready-arrow" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
      </a>
    </section>

    <!-- ── 3. 這些話先不要跟小孩說！（全年齡）：每個人都該看到，不收進折疊 ── -->
    <section class="part" id="dont" data-tone="honey" aria-labelledby="dontTitle">
      <div class="part-head">
        <!-- 對話框裡一個叉：這些話先別說 -->
        <span class="part-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2Z" />
            <path d="m9.6 7.6 4.8 4.8M14.4 7.6l-4.8 4.8" />
          </svg>
        </span>
        <h2 class="part-title" id="dontTitle">這些話先不要跟小孩說！</h2>
        <p class="part-sub"><span class="all-ages">全年齡適用</span>每一句都附上可以換成的說法。</p>
      </div>
      <div class="topic-list" id="dontList"></div>
    </section>

    <!-- 讀完之後的下一步：陪孩子玩小遊戲，或去「抽血大小問」 -->
    <aside class="help-card" aria-labelledby="nextTitle">
      <span class="help-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M12 20s-7-4.3-7-9.4A4 4 0 0 1 12 8a4 4 0 0 1 7 2.6C19 15.7 12 20 12 20Z" />
        </svg>
      </span>
      <h2 class="help-title" id="nextTitle">都讀完了嗎？</h2>
      <p>等待的時候，可以陪孩子玩個小遊戲；也可以看看抽血現場在做什麼。</p>
      <div class="help-links">
        <a class="help-link" href="/games/solo/">
          <span>陪孩子玩小遊戲</span>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
        <a class="help-link" href="/cheer/">
          <span>抽血大小問</span>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
      </div>
    </aside>
  </main>

  <!-- 醫檢師送出回饋時轉到「打針完畢」頁；載不到時頁面照常 -->
  <script type="module" src="/shared/firebase.js"></script>
  <script src="/guide/content.js"></script>
  <script src="/guide/guide.js"></script>
</body>

</html>
