<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="lean" cx="45%" cy="42%" r="66%">
      <stop offset="0" stop-color="#D84E47"/>
      <stop offset=".6" stop-color="#B5322D"/>
      <stop offset="1" stop-color="#8C2220"/>
    </radialGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8E2421"/>
      <stop offset="1" stop-color="#5F1513"/>
    </linearGradient>
    <linearGradient id="fat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7EA"/>
      <stop offset="1" stop-color="#EBD3AE"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3E3329" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3E3329" stop-opacity="0"/>
    </radialGradient>
    <path id="cut" d="M8.5 29.5C8 20.5 16 14 27 13c9-.8 13 3 19.5 3 7 0 11 5 11 12.5 0 10.5-9.5 18-23.5 19C20.5 48.5 9 40 8.5 29.5Z"/>
  </defs>
  <ellipse cx="33" cy="54" rx="26" ry="4.8" fill="url(#shadow)"/>
  <!-- 肉的厚度（側面） -->
  <use href="#cut" transform="translate(0 4.5)" fill="url(#side)"/>
  <!-- 切面：瘦肉 -->
  <use href="#cut" fill="url(#lean)"/>
  <!-- 上緣一條油邊 -->
  <path d="M9 26.5C10.5 19 17.5 13.8 27 13c9-.8 13 3 19.5 3 6 0 9.8 3.4 10.8 8.4-2.8-2.6-6-3.6-10.2-3.6-6.6 0-10.4-3-18.1-2.4-8.4.7-15 4.4-20 8.1Z" fill="url(#fat)"/>
  <!-- 細細的油花 -->
  <g fill="none" stroke="#F7E1CC" stroke-linecap="round" opacity=".55">
    <path d="M18 31c3-1.6 5.6-1 7.6.4 1.6 1.1 3.6 1 5.4-.2" stroke-width=".9"/>
    <path d="M30 38.5c2.6-1.2 5.4-.8 7.6.6" stroke-width=".8"/>
    <path d="M40 29c2-.8 4.2-.4 5.8.8" stroke-width=".7"/>
  </g>
  <!-- 肌肉紋理 -->
  <g fill="none" stroke="#EE8A80" stroke-linecap="round" stroke-opacity=".3" stroke-width="1">
    <path d="M14 36c7-2.4 15-2.6 23-.6"/><path d="M19 42.5c6-1.6 12-1.6 18 0"/>
  </g>
  <!-- 光澤 -->
  <ellipse cx="37" cy="25.5" rx="7" ry="2.2" fill="#FFFFFF" opacity=".22" transform="rotate(-8 37 25.5)"/>
</svg>
