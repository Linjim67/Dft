<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFCF3"/>
      <stop offset="1" stop-color="#F6ECD6"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E7CC"/>
      <stop offset="1" stop-color="#E5D4B0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D6B3"/>
      <stop offset="1" stop-color="#D3BF96"/>
    </linearGradient>
    <radialGradient id="bean" cx="38%" cy="35%" r="70%">
      <stop offset="0" stop-color="#FBE7B4"/>
      <stop offset=".6" stop-color="#EBC77E"/>
      <stop offset="1" stop-color="#C69B4E"/>
    </radialGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3E3329" stop-opacity=".3"/>
      <stop offset="1" stop-color="#3E3329" stop-opacity="0"/>
    </radialGradient>
    <g id="soy">
      <ellipse rx="4.4" ry="3.6" fill="url(#bean)"/>
      <path d="M-1.6-.3c.6.7 2 .7 2.8 0" stroke="#A9803E" stroke-width=".8" stroke-linecap="round" fill="none"/>
      <ellipse cx="-1.6" cy="-1.5" rx="1.2" ry=".7" fill="#FFFFFF" opacity=".55"/>
    </g>
  </defs>
  <ellipse cx="31" cy="54" rx="26" ry="5" fill="url(#shadow)"/>
  <!-- 豆腐：三個面 -->
  <path d="M9.5 24.5 31 15.5l21 8.5-21.5 9Z" fill="url(#top)" stroke="#E2D2AE" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M9.5 24.5 30.5 33v18L9.5 42.5Z" fill="url(#left)" stroke="#D9C69C" stroke-width=".7" stroke-linejoin="round"/>
  <path d="M30.5 33 52 24v17.5L30.5 51Z" fill="url(#right)" stroke="#CDB88C" stroke-width=".7" stroke-linejoin="round"/>
  <g fill="#D8C69F" opacity=".5">
    <circle cx="16" cy="33" r=".5"/><circle cx="22" cy="38" r=".45"/><circle cx="19" cy="42" r=".5"/><circle cx="26" cy="43" r=".4"/>
    <circle cx="38" cy="36" r=".45"/><circle cx="45" cy="34" r=".5"/><circle cx="41" cy="42" r=".4"/>
  </g>
  <!-- 黃豆 -->
  <use href="#soy" transform="translate(45 50) rotate(-15)"/>
  <use href="#soy" transform="translate(53.5 46.5) rotate(20)"/>
  <use href="#soy" transform="translate(37.5 54.5) rotate(5)"/>
  <use href="#soy" transform="translate(11 50.5) rotate(-25)"/>
