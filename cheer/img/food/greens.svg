<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="leaf" cx="45%" cy="38%" r="75%">
      <stop offset="0" stop-color="#5CA64A"/>
      <stop offset=".6" stop-color="#3A7D31"/>
      <stop offset="1" stop-color="#255A1F"/>
    </radialGradient>
    <radialGradient id="leafBack" cx="45%" cy="38%" r="75%">
      <stop offset="0" stop-color="#4A8F3E"/>
      <stop offset="1" stop-color="#1D4719"/>
    </radialGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A7D389"/>
      <stop offset=".75" stop-color="#8FC273"/>
      <stop offset="1" stop-color="#C8697A"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3E3329" stop-opacity=".28"/>
      <stop offset="1" stop-color="#3E3329" stop-opacity="0"/>
    </radialGradient>
    <!-- 菠菜葉：寬、圓頭的鏟形 -->
    <path id="blade" d="M0 0C-8.5-3-11.5-13-8.6-21.5-6.4-28.5 6.4-28.5 8.6-21.5 11.5-13 8.5-3 0 0Z"/>
    <path id="vein" d="M0-1.5V-24.5M0-8l-4.2-3.2M0-14l-4.6-3.2M0-20l-3.4-2.6M0-8l4.2-3.2M0-14l4.6-3.2M0-20l3.4-2.6"/>
  </defs>
  <ellipse cx="32" cy="57.5" rx="15" ry="3.2" fill="url(#shadow)"/>
  <!-- 莖：一把收在一起，根部帶紅 -->
  <g fill="none" stroke="url(#stem)" stroke-width="2.3" stroke-linecap="round">
    <path d="M19 37C23.5 44 28 51 30.6 57"/>
    <path d="M45 37C40.5 44 36 51 33.4 57"/>
    <path d="M25 35C28 43 30 50 31.3 57"/>
    <path d="M39 35C36 43 34 50 32.7 57"/>
    <path d="M32 37V57"/>
  </g>
  <!-- 葉子：後排、中排、最前面一片（全部留在畫面內） -->
  <g fill="url(#leafBack)">
    <use href="#blade" transform="translate(19 38) rotate(-36) scale(.8)"/>
    <use href="#blade" transform="translate(45 38) rotate(35) scale(.8)"/>
    <use href="#blade" transform="translate(25 35.5) rotate(-15) scale(.9)"/>
    <use href="#blade" transform="translate(39 35.5) rotate(14) scale(.9)"/>
  </g>
  <use href="#blade" transform="translate(32 38) scale(1.04)" fill="url(#leaf)"/>
  <!-- 葉脈 -->
  <g fill="none" stroke="#A8D891" stroke-linecap="round" stroke-width=".8" opacity=".7">
    <use href="#vein" transform="translate(32 38) scale(1.04)"/>
    <use href="#vein" transform="translate(25 35.5) rotate(-15) scale(.9)" opacity=".55"/>
    <use href="#vein" transform="translate(39 35.5) rotate(14) scale(.9)" opacity=".55"/>
  </g>
  <!-- 光澤 -->
  <ellipse cx="28" cy="20" rx="2" ry="5.5" fill="#FFFFFF" opacity=".16" transform="rotate(-12 28 20)"/>
</svg>
