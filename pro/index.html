<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <meta name="robots" content="noindex, nofollow">
  <title>安心陪伴 · 醫護端</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/pro/pro.css">
  <script src="/shared/app.js"></script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="site-header">
    <div class="wrap header-inner pro-header">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon icon-lg">
          <path d="M12 20.5s-7.2-4.35-7.2-9.4A4.3 4.3 0 0 1 12 8.6a4.3 4.3 0 0 1 7.2 2.5c0 5.05-7.2 9.4-7.2 9.4Z" />
          <path d="M9.4 6.2a2.6 2.6 0 1 1 5.2 0" />
        </svg>
      </span>
      <div class="brand-text">
        <p class="brand-name">安心陪伴</p>
        <p class="brand-tagline">醫護端</p>
      </div>
      <button class="quiet-link sign-out" type="button" id="signOutBtn" hidden>登出</button>
    </div>
  </header>

  <main id="main" class="wrap">

    <p class="boot-note" id="bootView">連線中…</p>

    <!-- ══════════ 畫面 A：登入 ══════════ -->
    <section id="loginView" hidden aria-labelledby="loginTitle">
      <div class="welcome">
        <h1 id="loginTitle" tabindex="-1">醫護人員登入</h1>
        <p class="welcome-lede">輸入團隊密碼後，就能用家長給的 4 位數代碼，查看孩子的狀況。</p>
      </div>

      <form id="loginForm" novalidate>
        <div class="field">
          <label class="field-label" for="staffPwd">團隊密碼</label>
          <input type="password" id="staffPwd" name="staffPwd" class="pwd-input" autocomplete="current-password"
            enterkeyhint="go" aria-required="true" aria-describedby="pwd-error">
          <p class="field-error" id="pwd-error" role="alert" hidden></p>
        </div>
        <button class="btn btn-primary" type="submit" id="loginBtn">
          <span class="btn-label" id="loginLabel">登入</span>
        </button>
        <p class="form-foot">登入 12 小時內有效。密碼不會上傳，只會送出加密後的金鑰。</p>
      </form>
    </section>

    <!-- ══════════ 畫面 B：查詢代碼 ══════════ -->
    <section id="lookupView" hidden aria-labelledby="lookupTitle">
      <h1 class="visually-hidden" id="lookupTitle" tabindex="-1">查詢暫時代碼</h1>

      <form id="lookupForm" class="lookup" role="search" novalidate>
        <label class="field-label" for="codeInput">家長的暫時代碼</label>
        <div class="lookup-row">
          <input type="text" id="codeInput" class="code-input" inputmode="numeric" pattern="[0-9]*" maxlength="4"
            autocomplete="off" enterkeyhint="search" placeholder="0000" aria-describedby="code-hint code-error">
          <button class="btn btn-primary lookup-btn" type="submit" id="lookupBtn">查詢</button>
        </div>
        <p class="field-hint" id="code-hint">家長手機主頁面上的 4 位數字，輸入完就會自動查詢。</p>
        <p class="field-error" id="code-error" hidden></p>
      </form>

      <!-- 查無此代碼／已失效／連線錯誤 -->
      <div class="result-note" id="resultNote" role="status" hidden>
        <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
          <circle cx="12" cy="12" r="8.2" />
          <path d="M12 8v4.6M12 15.8h.01" />
        </svg>
        <div>
          <p class="result-note-title" id="resultTitle"></p>
          <p class="result-note-body" id="resultBody"></p>
        </div>
      </div>

      <!-- ── 查到了：孩子的資料 + 醫檢師回饋 ── -->
      <div id="caseView" hidden>
        <section class="case" aria-labelledby="caseTitle">
          <div class="case-head">
            <h2 class="case-title" id="caseTitle" tabindex="-1">代碼 <span id="caseCode"></span></h2>
            <p class="case-expiry" id="caseExpiry"></p>
          </div>
          <dl class="summary-card" id="caseSummary"></dl>
        </section>

        <h2 class="section-title">打完針之後</h2>

        <div id="errorSummary" class="error-summary" role="alert" tabindex="-1"
          aria-labelledby="errorSummaryTitle" hidden>
          <p class="error-summary-head">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <circle cx="12" cy="12" r="8.2" />
              <path d="M12 8v4.6M12 15.8h.01" />
            </svg>
            <span id="errorSummaryTitle">還有地方需要補上</span>
          </p>
          <ul id="errorList"></ul>
        </div>

        <form id="staffForm" novalidate>
          <fieldset class="field">
            <legend class="field-label">
              <span id="fearQuestion"></span> <span class="req">必填</span>
            </legend>
            <p class="field-hint" id="fear-hint">淡色那一格是家長選的；請點選您觀察到的程度。</p>
            <div class="face-scale staff-scale" id="staffScale" data-name="staffFear"
              data-describedby="fear-hint staffFear-error"></div>
            <p class="field-error" id="staffFear-error" hidden></p>
          </fieldset>

          <div class="field">
            <label class="field-label" for="staffNote">
              還有什麼想補充的嗎？ <span class="opt">選填</span>
            </label>
            <textarea id="staffNote" name="staffNote" maxlength="500" rows="3"
              placeholder="例如：抽血時一直看平板，幾乎沒哭。" aria-describedby="note-hint note-count"></textarea>
            <p class="char-count" id="note-count" aria-live="polite">還可以輸入 500 字</p>
            <p class="field-hint note-hint" id="note-hint">請不要寫孩子的姓名或病歷號。</p>
          </div>

          <button class="btn btn-primary" type="submit" id="finishBtn">
            <span class="btn-label" id="finishLabel">送出，結束這組代碼</span>
          </button>
          <p class="field-error" id="finish-error" role="alert" hidden></p>
          <p class="form-foot">送出後這組代碼立即失效，孩子的資料也會從查詢系統移除。</p>
        </form>
      </div>

      <!-- ── 送出之後 ── -->
      <section id="doneView" class="success-view" hidden aria-labelledby="doneTitle">
        <div class="success-badge" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon"><path d="M6 12.4 10.2 16.6 18 8.8" /></svg>
        </div>
        <h2 id="doneTitle" class="done-title" tabindex="-1">已送出，辛苦了</h2>
        <p class="success-lede">代碼 <strong id="doneCode"></strong> 已經失效，不能再查詢。</p>
        <button class="btn btn-primary" type="button" id="nextBtn">查詢下一位</button>
      </section>
    </section>
  </main>

  <div class="live-region" id="liveRegion" role="status" aria-live="polite"></div>
  <script type="module" src="/shared/firebase.js"></script>
  <script src="/pro/pro.js"></script>
</body>

</html>
