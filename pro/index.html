<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#1C1917">
  <meta name="robots" content="noindex, nofollow">
  <title>安心陪伴 · 醫護端</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/pro/pro.css">
  <script src="/shared/app.js"></script>
</head>

<body class="pro">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <!-- 醫護模式列：深色，和家長端一眼分得出來 -->
  <header class="staff-bar">
    <div class="staff-bar-inner">
      <span class="staff-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" class="icon">
          <path d="M12 20.5s-7.2-4.35-7.2-9.4A4.3 4.3 0 0 1 12 8.6a4.3 4.3 0 0 1 7.2 2.5c0 5.05-7.2 9.4-7.2 9.4Z" />
          <path d="M9.4 6.2a2.6 2.6 0 1 1 5.2 0" />
        </svg>
      </span>
      <p class="staff-title">安心陪伴 <span class="staff-badge">醫護端</span></p>
      <p class="staff-session" id="sessionInfo" hidden></p>
      <button class="staff-signout" type="button" id="signOutBtn" hidden>登出</button>
    </div>
  </header>

  <main id="main" class="pro-main">

    <p class="boot-note" id="bootView" role="status">連線中…</p>

    <!-- ══════════ 登入 ══════════ -->
    <section class="login" id="loginView" hidden aria-labelledby="loginTitle">
      <div class="login-card">
        <h1 class="login-title" id="loginTitle" tabindex="-1">醫護登入</h1>

        <form id="loginForm" novalidate>
          <!-- 給密碼管理工具辨識帳號用；畫面與報讀都看不到 -->
          <input class="visually-hidden" type="text" name="username" autocomplete="username"
            value="anxin-staff" tabindex="-1" aria-hidden="true">

          <label class="field-label" for="staffPwd">團隊密碼</label>
          <div class="pwd-wrap">
            <input type="password" id="staffPwd" name="password" class="pwd-input" autocomplete="current-password"
              enterkeyhint="go" spellcheck="false" aria-required="true" aria-describedby="pwd-error">
            <button class="pwd-toggle" type="button" id="pwdToggle" aria-pressed="false" aria-label="顯示密碼">
              <svg viewBox="0 0 24 24" class="icon eye-open" aria-hidden="true">
                <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg viewBox="0 0 24 24" class="icon eye-closed" aria-hidden="true">
                <path d="M4 4.5 20 19.5" />
                <path d="M9.9 6A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-2.6 3.4M6.6 7.6C4 9.4 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9 9 0 0 0 4.2-1" />
                <path d="M10 10.1a2.8 2.8 0 0 0 3.9 3.9" />
              </svg>
            </button>
          </div>
          <p class="field-error" id="pwd-error" role="alert" hidden></p>

          <button class="btn btn-primary login-btn" type="submit" id="loginBtn">
            <span class="btn-label" id="loginLabel">登入</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ══════════ 工作台 ══════════
         data-phase：entry（輸入代碼）→ case（看資料、評分）→ done（已送出）
         手機：一次一個階段 · 觸控平板：左鍵盤右資料 ·
         電腦（寬螢幕 + 滑鼠）：上方代碼列、資料與評分並排、右側最近完成，不顯示數字鍵 -->
    <div class="desk" id="deskView" data-phase="entry" hidden>
      <h1 class="visually-hidden">醫護端工作台</h1>

      <!-- ── 輸入代碼 ── -->
      <section class="entry" id="entry" aria-labelledby="entryTitle">
        <h2 class="entry-title" id="entryTitle">家長代碼</h2>

        <!-- 四格顯示 + 疊在上面的真正輸入框（可貼上、可用實體鍵盤；inputmode=none 不叫出手機鍵盤） -->
        <div class="slots" id="slots">
          <input class="slots-input" id="codeInput" type="text" inputmode="none" autocomplete="off"
            maxlength="4" spellcheck="false" aria-labelledby="entryTitle">
          <span class="slot" aria-hidden="true"></span>
          <span class="slot" aria-hidden="true"></span>
          <span class="slot" aria-hidden="true"></span>
          <span class="slot" aria-hidden="true"></span>
        </div>

        <div class="keypad" role="group" aria-label="數字鍵">
          <button class="key" type="button" data-key="1">1</button>
          <button class="key" type="button" data-key="2">2</button>
          <button class="key" type="button" data-key="3">3</button>
          <button class="key" type="button" data-key="4">4</button>
          <button class="key" type="button" data-key="5">5</button>
          <button class="key" type="button" data-key="6">6</button>
          <button class="key" type="button" data-key="7">7</button>
          <button class="key" type="button" data-key="8">8</button>
          <button class="key" type="button" data-key="9">9</button>
          <button class="key key-fn" type="button" data-key="clear">清除</button>
          <button class="key" type="button" data-key="0">0</button>
          <button class="key key-fn" type="button" data-key="back" aria-label="刪除一位">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
              <path d="M8.5 5.5h11a1.5 1.5 0 0 1 1.5 1.5v10a1.5 1.5 0 0 1-1.5 1.5h-11L3 12l5.5-6.5Z" />
              <path d="m11.5 9.5 5 5M16.5 9.5l-5 5" />
            </svg>
          </button>
        </div>

        <!-- 電腦才顯示：在頁面任何地方打數字都會進代碼 -->
        <p class="kbd-hint" aria-hidden="true"><kbd>0</kbd>–<kbd>9</kbd> 輸入　<kbd>Esc</kbd> 清除</p>
      </section>

      <!-- ── 查詢結果 ── -->
      <section class="panel" id="panel" aria-label="查詢結果">

        <!-- 手機：看資料時鍵盤收起來，這一條可以回去換代碼 -->
        <div class="code-bar" id="codeBar">
          <button class="code-bar-back" type="button" id="changeCodeBtn">
            <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
            <span>換代碼</span>
          </button>
          <p class="code-bar-code"><strong id="barCode"></strong></p>
        </div>

        <!-- 還沒查詢（平板、電腦） -->
        <div class="panel-empty" id="emptyView">
          <svg viewBox="0 0 24 24" class="icon panel-empty-icon" aria-hidden="true">
            <rect x="4.5" y="3.5" width="15" height="17" rx="2.5" />
            <path d="M9 3.5h6v2.5H9zM8.5 11h7M8.5 14.5h4.5" />
          </svg>
          <p class="panel-empty-title">輸入或點選代碼</p>
        </div>

        <p class="panel-loading" id="loadingView" role="status" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>查詢中…</span>
        </p>

        <!-- 查無／已結束／過期／連線錯誤 -->
        <div class="result-note" id="resultNote" hidden>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
            <circle cx="12" cy="12" r="8.2" />
            <path d="M12 8v4.6M12 15.8h.01" />
          </svg>
          <div class="result-note-text">
            <h2 class="result-note-title" id="resultTitle" tabindex="-1"></h2>
            <p class="result-note-body" id="resultBody"></p>
            <button class="btn btn-quiet result-note-btn" type="button" id="retryBtn">重新輸入</button>
          </div>
        </div>

        <!-- ══ 查到了 ══ -->
        <div class="case" id="caseView" hidden>

          <section class="case-step" aria-labelledby="beforeTitle">
            <h2 class="step-title" id="beforeTitle" tabindex="-1">
              <span class="step-num" aria-hidden="true">1</span>打針前
            </h2>
            <article class="patient" id="patientCard"></article>
          </section>

          <section class="case-step" aria-labelledby="afterTitle">
            <h2 class="step-title" id="afterTitle">
              <span class="step-num" aria-hidden="true">2</span>打完針後
            </h2>

            <div id="errorSummary" class="error-summary" role="alert" tabindex="-1"
              aria-labelledby="errorSummaryTitle" hidden>
              <p class="error-summary-head">
                <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.2" />
                  <path d="M12 8v4.6M12 15.8h.01" />
                </svg>
                <span id="errorSummaryTitle">未完成</span>
              </p>
              <ul id="errorList"></ul>
            </div>

            <form class="rate-card" id="staffForm" novalidate>
              <fieldset class="field">
                <legend class="field-label" id="fearQuestion"></legend>
                <div class="face-scale staff-scale" id="staffScale" data-name="staffFear"
                  data-describedby="staffFear-error"></div>
                <p class="compare-note" id="compareNote" role="status" hidden></p>
                <p class="field-error" id="staffFear-error" hidden></p>
              </fieldset>

              <div class="field">
                <label class="field-label" for="staffNote">補充<span class="label-opt">（選填）</span></label>
                <textarea id="staffNote" name="staffNote" maxlength="500" rows="3"
                  placeholder="例：一直看平板，沒哭" aria-describedby="note-hint note-count"></textarea>
                <div class="note-meta">
                  <p class="note-hint" id="note-hint">勿填姓名、病歷號</p>
                  <p class="char-count" id="note-count" aria-live="polite">0 / 500</p>
                </div>
              </div>

              <button class="btn btn-primary finish-btn" type="submit" id="finishBtn">
                <span class="btn-label" id="finishLabel">送出</span>
                <span class="kbd-inline" aria-hidden="true"><kbd>Ctrl</kbd>+<kbd>Enter</kbd></span>
              </button>
              <p class="field-error" id="finish-error" role="alert" hidden></p>
              <p class="form-foot">送出後代碼即失效</p>
            </form>
          </section>
        </div>

        <!-- ══ 送出之後 ══ -->
        <section class="done" id="doneView" hidden aria-labelledby="doneTitle">
          <div class="success-badge" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="icon"><path d="M6 12.4 10.2 16.6 18 8.8" /></svg>
          </div>
          <div class="done-text">
            <h2 class="done-title" id="doneTitle" tabindex="-1"><span id="doneCode"></span> 已送出</h2>
            <p class="done-lede">代碼已失效</p>
          </div>
          <button class="btn btn-primary done-btn" type="button" id="nextBtn">下一位</button>
        </section>
      </section>

      <!-- ── 側欄：等待中 + 最近完成 ──
           放在結果後面：手機上「查無」會緊接在鍵盤下方；平板排在鍵盤下、電腦排在右側 -->
      <div class="side" id="side">
        <!-- 家長一領到代碼就出現在這裡：只有號碼，沒有任何個人資料；點號碼＝輸入那組代碼 -->
        <section class="waiting" id="waiting" aria-labelledby="waitingTitle">
          <h2 class="side-title" id="waitingTitle">等待中 <span class="side-count" id="waitingCount">0</span></h2>
          <ul class="waiting-list" id="waitingList"></ul>
          <p class="side-empty" id="waitingEmpty">—</p>
          <!-- 手機、平板：先顯示最新 9 組，其餘收起來（不做頁中頁的捲動區） -->
          <button class="quiet-link waiting-more" type="button" id="waitingMore" aria-expanded="false"
            aria-controls="waitingList" hidden></button>
        </section>

        <!-- 這台裝置最近送出的代碼：確認剛剛真的送出了 -->
        <section class="recent" id="recent" aria-labelledby="recentTitle" hidden>
          <h2 class="side-title" id="recentTitle">最近完成</h2>
          <ol class="recent-list" id="recentList"></ol>
        </section>
      </div>
    </div>
  </main>

  <!-- 換代碼時，還沒送出的評分會被清掉：先問。預設焦點在「回到原本的代碼」 -->
  <dialog class="dlg" id="discardDlg" aria-labelledby="discardTitle">
    <h2 class="dlg-title" id="discardTitle"><span id="discardCode"></span> 還沒送出</h2>
    <div class="dlg-actions">
      <button class="btn btn-primary" type="button" data-close autofocus id="discardKeep">回到 <span id="discardKeepCode"></span></button>
      <button class="btn btn-danger" type="button" id="discardGo">放棄</button>
    </div>
  </dialog>

  <div class="live-region" id="liveRegion" role="status" aria-live="polite"></div>
  <script type="module" src="/shared/firebase.js"></script>
  <script src="/pro/pro.js"></script>
</body>

</html>
