<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 小遊戲・雙機</title>
  <!-- favicon：手繪針筒（/favicon.svg）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/games/duo/duo.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <!-- 規格：任何子頁都能直接「開始打針」 -->
  <header class="wrap topbar">
    <a class="back-link" href="/home/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>回主頁</span>
    </a>
    <a class="pill-cta" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <h1>小遊戲・雙機</h1>
    </div>

    <!-- 連線狀態（文字 + 圓點，不只靠顏色） -->
    <p class="duo-status" id="duoStatus" role="status"><span class="dot" aria-hidden="true"></span><span id="duoStatusText">正在準備連線…</span></p>

    <!-- 1. 還沒連線：給孩子的手機掃 -->
    <section class="duo-card pair-card" id="pairCard" aria-labelledby="pairTitle">
      <h2 class="duo-card-title" id="pairTitle">用孩子的手機掃描</h2>
      <div class="qr" id="qrBox" aria-hidden="true"></div>
      <p class="pair-code-label">或在孩子的手機輸入網址</p>
      <p class="pair-url"><span id="joinUrl"></span></p>
      <p class="pair-code" aria-label="配對代碼">代碼 <strong id="joinCode"></strong></p>
      <button class="btn btn-quiet share-btn" type="button" id="shareBtn">複製連結</button>
    </section>

    <!-- 2. 孩子選了遊戲：答應或拒絕 -->
    <section class="duo-card request-card" id="requestCard" hidden aria-labelledby="requestTitle">
      <p class="duo-kicker">孩子想玩</p>
      <h2 class="duo-card-title" id="requestTitle"></h2>
      <div class="card-actions">
        <button class="btn btn-quiet" type="button" id="rejectBtn">等一下</button>
        <button class="btn btn-primary" type="button" id="acceptBtn">好，開始</button>
      </div>
    </section>

    <!-- 3. 正在玩：回到遙控器 -->
    <section class="duo-card playing-card" id="playingCard" hidden aria-labelledby="playingTitle">
      <p class="duo-kicker">正在玩</p>
      <h2 class="duo-card-title" id="playingTitle">打地鼠</h2>
      <div class="card-actions">
        <button class="btn btn-quiet" type="button" id="endGameBtn">結束遊戲</button>
        <a class="btn btn-primary" id="remoteLink" href="/games/duo/whack-a-mole/">打開遙控器</a>
      </div>
    </section>

    <!-- 已連線：等孩子選遊戲 -->
    <section class="duo-card waiting-card" id="waitingCard" hidden aria-labelledby="waitingTitle">
      <h2 class="duo-card-title" id="waitingTitle">等孩子選遊戲</h2>
      <p class="duo-card-body">孩子在他的手機上點一個遊戲，這裡就會問你要不要答應。</p>
    </section>

    <p class="center"><button class="quiet-link" type="button" id="unpairBtn" hidden>重新配對（換一支孩子的手機）</button></p>

    <section class="duo-card error-card" id="errorCard" hidden role="alert">
      <h2 class="duo-card-title" id="errorTitle"></h2>
      <p class="duo-card-body" id="errorBody"></p>
    </section>
  </main>

  <script type="module" src="/shared/firebase.js"></script>
  <script src="/games/duo/duo-core.js"></script>
  <script src="/games/duo/duo-qr.js"></script>
  <script src="/games/duo/duo.js"></script>
</body>

</html>
