<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 打地鼠遙控器</title>
  <!-- favicon：手繪針筒（/favicon.svg）。sizes 寫在 .ico 上，Chrome 才會選 SVG -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/games/duo/duo.css">
  <link rel="stylesheet" href="/games/duo/whack-a-mole/remote.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
  <script src="/shared/playtime.js"></script>
</head>

<body class="remote-page">
  <a class="skip-link" href="#main">跳到主要內容</a>

  <header class="wrap topbar">
    <a class="back-link" href="/games/duo/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>雙機</span>
    </a>
    <a class="pill-cta" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <h1>打地鼠・遙控器</h1>
    </div>

    <!-- 孩子的手機現在在做什麼（文字 + 圓點） -->
    <p class="duo-status" id="duoStatus" role="status"><span class="dot" aria-hidden="true"></span><span id="duoStatusText">正在連線…</span></p>

    <!-- 孩子畫面上的回合、時間、分數，與正在進行的事件 -->
    <div class="remote-hud" id="remoteHud">
      <span class="rh-round" id="rRound">—</span>
      <span class="rh-time"><strong id="rTime">—</strong> 秒</span>
      <span class="rh-score"><strong id="rScore">0</strong> 分</span>
    </div>
    <p class="rh-chips" id="rChips"></p>

    <!-- 規格：手動放置／自動出現 的切換 -->
    <fieldset class="remote-section">
      <legend class="section-title">角色怎麼出現</legend>
      <div class="segmented mode-seg">
        <label class="segmented-option">
          <input type="radio" name="mode" value="manual">
          <span class="segmented-face">我來放</span>
        </label>
        <label class="segmented-option">
          <input type="radio" name="mode" value="auto">
          <span class="segmented-face">自動出現</span>
        </label>
      </div>
      <p class="remote-hint" id="modeHint"></p>
    </fieldset>

    <!-- 手動：角色排好隊，家長只要點洞；點一下就放隊伍最前面那一個 -->
    <section class="remote-section" id="placeSection" aria-labelledby="lineTitle">
      <h2 class="section-title" id="lineTitle">排隊出場</h2>
      <ol class="line" id="line" aria-describedby="lineHint"></ol>
      <p class="remote-hint" id="lineHint"></p>
    </section>

    <!-- 病毒：能發動時才出現按鈕；位置固定（還不能按時放說明），按鈕出現時棋盤不會被擠下去 -->
    <div class="storm" id="storm">
      <button type="button" class="storm-btn" id="stormBtn" hidden>
        <svg class="storm-art" aria-hidden="true"><use href="#ch-virus"></use></svg>
        <span class="storm-text"><span class="storm-name">開始病毒入侵</span><span class="storm-note" id="stormNote"></span></span>
      </button>
      <p class="storm-wait" id="stormWait">
        <svg class="storm-art" aria-hidden="true"><use href="#ch-virus"></use></svg>
        <span class="storm-text"><span class="storm-name" id="stormWaitName">病毒還沒準備好</span><span class="storm-note" id="stormWaitNote"></span></span>
      </p>
    </div>

    <!-- 孩子的棋盤（同步顯示）；手動時點空洞就放進去 -->
    <div class="mirror" id="mirror" role="group" aria-label="孩子的棋盤"></div>

    <section class="remote-section" aria-labelledby="trickTitle">
      <h2 class="section-title" id="trickTitle">搗蛋</h2>
      <div class="event-grid" id="trickEvents"></div>
      <h2 class="section-title help-title">幫忙</h2>
      <div class="event-grid" id="helpEvents"></div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- 斷線：蓋一個對話框（不只狀態列的一行字） -->
  <dialog class="dlg lost-dlg" id="lostDlg" aria-labelledby="lostTitle" aria-describedby="lostBody">
    <h2 class="dlg-title" id="lostTitle"></h2>
    <p class="dlg-body" id="lostBody"></p>
    <div class="dlg-actions">
      <button class="btn btn-primary" type="button" id="lostAction"></button>
      <a class="btn btn-quiet" href="/games/duo/">回配對頁</a>
    </div>
  </dialog>

  <script type="module" src="/shared/firebase.js"></script>
  <script src="/games/duo/duo-core.js"></script>
  <script src="/games/duo/whack-a-mole/remote.js"></script>
</body>

</html>
