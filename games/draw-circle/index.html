<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 畫圓圈</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/games/draw-circle/draw-circle.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="icon-star" viewBox="0 0 24 24">
      <path d="M12 3.2l2.7 5.5 6 .9-4.35 4.25 1 6L12 17l-5.35 2.85 1-6L3.3 9.6l6-.9Z" />
    </symbol>
  </svg>

  <header class="wrap topbar">
    <a class="back-link" href="/games/solo/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>小遊戲</span>
    </a>
    <a class="pill-cta" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </header>

  <main id="main" class="wrap dc">

    <!-- ══════════ 開始畫面 ══════════ -->
    <section id="introView" aria-labelledby="introTitle">
      <div class="page-head">
        <h1 id="introTitle" tabindex="-1">畫圓圈</h1>
        <p class="page-lede">一筆畫出一個圓，看看有多圓！每個人可以畫三次。</p>
      </div>

      <fieldset class="field dc-mode">
        <legend class="field-label">要怎麼玩？</legend>
        <div class="segmented dc-segmented">
          <label class="segmented-option">
            <input type="radio" name="mode" value="1" checked>
            <span class="segmented-face">自己玩</span>
          </label>
          <label class="segmented-option">
            <input type="radio" name="mode" value="2">
            <span class="segmented-face">和爸爸媽媽比賽</span>
          </label>
        </div>
        <p class="field-hint dc-mode-hint">比賽時用同一支手機，輪流畫。</p>
      </fieldset>

      <p class="dc-best" id="bestLine" hidden></p>

      <button class="btn btn-primary" type="button" id="startBtn">開始畫</button>
    </section>

    <!-- ══════════ 畫畫 ══════════ -->
    <section id="drawView" hidden aria-labelledby="turnTitle">
      <div class="dc-turn">
        <h1 class="dc-turn-title" id="turnTitle" tabindex="-1">第 1 / 3 次</h1>
        <p class="dc-turn-hint" id="turnHint">用一根手指，一筆畫一個圓</p>
      </div>

      <!-- 手繪是這個遊戲的本質（WCAG 2.5.7 的「必要」例外）；分數另外以文字播報 -->
      <div class="pad-wrap">
        <canvas class="pad" id="pad" role="img" aria-label="畫圓圈的畫布：用手指一筆畫一個圓"></canvas>
        <!-- 教學用動畫：一根手指從上面開始、一筆畫一個圓（畫完會淡掉、再重來）；一開始畫就不見 -->
        <div class="pad-empty" id="padEmpty" aria-hidden="true">
          <svg class="pad-demo" id="padDemo" viewBox="0 0 200 200">
            <circle class="demo-guide" cx="100" cy="100" r="60" />
            <path class="demo-stroke" d="M100 40A60 60 0 1 1 99.9 40" pathLength="100">
              <animate attributeName="stroke-dashoffset" values="100;0;0;0" keyTimes="0;.62;.86;1" dur="3.2s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="1;1;1;0" keyTimes="0;.62;.86;1" dur="3.2s" repeatCount="indefinite" />
            </path>
            <g class="demo-hand">
              <animateMotion path="M100 40A60 60 0 1 1 99.9 40" keyPoints="0;1;1;1" keyTimes="0;.62;.86;1" calcMode="linear" dur="3.2s" repeatCount="indefinite" />
              <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.66;.8;.97;1" dur="3.2s" repeatCount="indefinite" />
              <circle class="demo-tip" r="7" />
              <path d="M9 11V5a2 2 0 0 1 4 0v5l4.3.9a2 2 0 0 1 1.6 2.2l-.6 4.4A3 3 0 0 1 15.3 20H11a3 3 0 0 1-2.5-1.3L5.6 14.5a1.7 1.7 0 0 1 2.6-2.2L9 13Z" transform="scale(2.3) translate(-11 -3)" />
            </g>
          </svg>
          <span class="pad-demo-text">一筆畫一個圓</span>
        </div>
      </div>

      <div class="dc-result" id="resultBox" hidden>
        <p class="dc-score"><strong id="scoreNum">0</strong><span>分</span></p>
        <p class="dc-stars" id="scoreStars"></p>
        <p class="dc-rating" id="scoreText"></p>
        <p class="dc-legend"><span class="legend-line" aria-hidden="true"></span>虛線是最完美的圓</p>
      </div>

      <p class="dc-warn" id="warnBox" role="alert" hidden></p>

      <div class="dc-actions">
        <button class="btn btn-primary" type="button" id="nextBtn" hidden>下一次</button>
        <button class="btn btn-quiet" type="button" id="retryBtn" hidden>再畫一次</button>
      </div>
    </section>

    <!-- ══════════ 結果 ══════════ -->
    <section id="resultsView" hidden aria-labelledby="resultsTitle">
      <h1 class="dc-results-title" id="resultsTitle" tabindex="-1">結果出爐！</h1>
      <p class="dc-winner" id="winnerLine"></p>
      <ul class="dc-board" id="scoreBoard"></ul>
      <p class="dc-record" id="recordLine" hidden></p>
      <div class="dc-actions">
        <button class="btn btn-primary" type="button" id="againBtn">再玩一次</button>
        <a class="quiet-link" href="/games/solo/">回小遊戲選單</a>
      </div>
    </section>
  </main>

  <div class="live-region" id="liveRegion" role="status" aria-live="polite"></div>

  <script src="/games/draw-circle/circle.js"></script>
  <script src="/games/draw-circle/draw-circle.js"></script>
</body>

</html>
