<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#FFF7ED">
  <title>安心陪伴 · 小遊戲・單機</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/shared/page.css">
  <link rel="stylesheet" href="/games/solo/solo.css">
  <script src="/shared/app.js"></script>
  <script>Anxin.requireProfile();</script>
</head>

<body>
  <a class="skip-link" href="#main">跳到主要內容</a>

  <!-- 規格：任何子頁都能直接「開始打針」 -->
  <header class="wrap topbar">
    <a class="back-link" href="/home/">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M15 5 8 12l7 7" /></svg>
      <span>回主頁</span>
    </a>
    <a class="pill-cta" href="/shot/">
      <span>開始打針</span>
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
    </a>
  </header>

  <main id="main" class="wrap">
    <div class="page-head">
      <h1>小遊戲・單機</h1>
      <p class="page-lede">一支手機就能玩，讓等待快一點過去。</p>
    </div>

    <!-- 規格：選單裡有很多遊戲，小朋友自己選 -->
    <div class="card-list">
      <a class="nav-card" href="/games/whack-a-mole/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <ellipse cx="12" cy="18" rx="8" ry="3" />
            <path d="M7.5 17.5V11a4.5 4.5 0 0 1 9 0v6.5" />
            <path d="M10.3 11h.01M13.7 11h.01" />
          </svg>
        </span>
        <span>
          <span class="card-title">打地鼠</span>
          <span class="card-desc">把跑出來的醫院小幫手敲回洞裡</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <a class="nav-card" href="/games/draw-circle/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon"><circle cx="12" cy="12" r="7.5" /></svg>
        </span>
        <span>
          <span class="card-title">畫圓圈</span>
          <span class="card-desc">一筆畫一個圓，看看有多圓</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <a class="nav-card" href="/games/dash/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M14 4c3.3 0 6 4.6 6 8.4A6 6 0 0 1 8 12.4C8 8.6 10.7 4 14 4Z" />
            <path d="M8.2 11.3h11.6M2.5 9.5h3M2 13h3.5M2.5 16.5h3" />
          </svg>
        </span>
        <span>
          <span class="card-title">膠囊衝衝衝</span>
          <span class="card-desc">跳過針頭、坐火箭、開飛碟，衝到終點</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <a class="nav-card" href="/games/golf/">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M9 18V3l7 3-7 3" />
            <ellipse cx="12" cy="19" rx="8" ry="2.5" />
            <circle cx="17" cy="15.5" r="1.5" />
          </svg>
        </span>
        <span>
          <span class="card-title">浮空小島高爾夫</span>
          <span class="card-desc">往後拉、放開，把球打進天上小島的洞裡</span>
        </span>
        <svg viewBox="0 0 24 24" class="icon card-chevron" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
      </a>

      <div class="nav-card is-soon" aria-disabled="true">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" class="icon">
            <path d="M4 19h16M7 19v-4h4v4M14 19v-7h4v7" />
            <path d="M8 9.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z" />
          </svg>
        </span>
        <span>
          <span class="card-title">跳跳冒險</span>
          <span class="card-desc">跳過障礙，往終點前進</span>
        </span>
        <span class="soon-badge">即將推出</span>
      </div>
    </div>
  </main>

  <script src="/games/solo/solo.js"></script>
</body>

</html>
